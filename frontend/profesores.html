<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profesores - Sistema de Préstamos</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profesores.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body>

<div class="layout">

    <!-- Menú lateral -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">
                <i class="bi bi-people-fill"></i>
            </div>

            <div>
                <h2>Préstamos</h2>
                <span>Panel administrativo</span>
            </div>
        </div>

        <nav class="menu">

            <a href="dashboard.html">
                <i class="bi bi-house-door-fill"></i>
                Principal
            </a>

            <a href="prestamos.html">
                <i class="bi bi-clipboard-check-fill"></i>
                Préstamos
            </a>

            <a href="profesores.html" class="active">
                <i class="bi bi-people-fill"></i>
                Profesores
            </a>

            <a href="materiales.html">
                <i class="bi bi-box-seam-fill"></i>
                Materiales
            </a>

        </nav>

        <a href="login.html" class="logout">
            <i class="bi bi-box-arrow-right"></i>
            Cerrar sesión
        </a>

    </aside>

    <!-- Contenido principal -->
    <main class="main">

        <header class="topbar">

            <div>
                <h1>Profesores</h1>

                <p>
                    Administración de profesores autorizados para
                    solicitar material.
                </p>
            </div>

            <button
                type="button"
                class="btn-primary"
                onclick="abrirModal()"
            >
                + Nuevo profesor
            </button>

        </header>

        <!-- Buscador y filtro -->
        <section class="filters">

            <input
                type="text"
                id="buscadorProfesores"
                placeholder="Buscar por nombre o número económico"
            >

            <select id="filtroEstado">
                <option value="TODOS">Todos</option>
                <option value="ACTIVO">Activos</option>
                <option value="INACTIVO">Inactivos</option>
            </select>

        </section>

        <!-- Tabla de profesores -->
        <section class="panel">

            <div class="panel-header">

                <h2>Profesores registrados</h2>

                <span id="contadorProfesores">
                    0 profesores
                </span>

            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Profesor</th>
                            <th>No. Económico</th>
                            <th>Teléfono</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaProfesores">

                        <tr>
                            <td
                                colspan="5"
                                class="empty-message"
                            >
                                Cargando profesores...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<!-- Modal para registrar o editar profesor -->
<div class="modal" id="modalProfesor">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="tituloModalProfesor">
                Nuevo profesor
            </h2>

            <button
                type="button"
                class="close-modal"
                onclick="cerrarModal()"
                aria-label="Cerrar"
            >
                &times;
            </button>

        </div>

        <form id="formProfesor" class="client-form">

            <!-- Se usa al editar -->
            <input
                type="hidden"
                id="idProfesor"
            >

            <div class="form-group">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Ej. Pedro"
                    required
                >

            </div>

            <div class="form-group">

                <label for="apellidoP">
                    Apellido paterno
                </label>

                <input
                    type="text"
                    id="apellidoP"
                    placeholder="Ej. Martínez"
                    required
                >

            </div>

            <div class="form-group">

                <label for="apellidoM">
                    Apellido materno
                </label>

                <input
                    type="text"
                    id="apellidoM"
                    placeholder="Ej. López"
                >

            </div>

            <div class="form-group">

                <label for="numeroEconomico">
                    Número económico
                </label>

                <input
                    type="text"
                    id="numeroEconomico"
                    placeholder="Ej. 1004"
                    required
                >

            </div>

            <div class="form-group">

                <label for="correo">
                    Correo institucional
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="profesor@universidad.mx"
                    required
                >

            </div>

            <div class="form-group">

                <label for="telefono">
                    Teléfono
                </label>

                <input
                    type="text"
                    id="telefono"
                    placeholder="Ej. 5551118888"
                >

            </div>

            <div class="form-group full">

                <label for="extension">
                    Extensión
                </label>

                <input
                    type="text"
                    id="extension"
                    placeholder="Ej. 104"
                >

            </div>

            <div class="modal-actions full">

                <button
                    type="button"
                    class="btn-cancel"
                    onclick="cerrarModal()"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn-save"
                    id="btnGuardarProfesor"
                >
                    Guardar profesor
                </button>

            </div>

        </form>

    </div>

</div>

<!-- Toda la lógica está en este archivo -->
<script src="js/profesores.js"></script>

</body>

</html>
