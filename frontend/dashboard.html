<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Préstamos</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <div class="dashboard">

        <aside class="sidebar">
            <h2>Préstamos</h2>

            <nav>

                <a href="#">Pagos</a>

        <main class="main-content">

            <header class="topbar">
